<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Pintaria Course - Bimbel Matematika</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Red23JZ7zN3yFFDQ5aVISnPvdFMLUduj=w800">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
        iframe {
            width: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbzUUtyn-cqUvAdNw3bT9yZeZT4yJ1G9IzbhDDbJCjvrG7NkkKHiUOzRTxisb7FNg5CrhA/exec" allow="clipboard-write"></iframe>

    <script>
        (function() {
            var img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = "https://lh3.googleusercontent.com/d/1Red23JZ7zN3yFFDQ5aVISnPvdFMLUduj=w800";
            img.onload = function() {
                var canvas = document.createElement("canvas");
                canvas.width = 128;
                canvas.height = 128;
                var ctx = canvas.getContext("2d");
                // Zoom 1.45x ke bagian tengah gambar agar ruang kosong di pinggir terpotong
                var zoom = 1.45;
                var size = 128 * zoom;
                var offset = (128 - size) / 2;
                ctx.drawImage(img, offset, offset, size, size);
                try {
                    document.getElementById("dynamicFavicon").href = canvas.toDataURL("image/png");
                } catch (e) {}
            };
        })();
    </script>
</body>
</html>
